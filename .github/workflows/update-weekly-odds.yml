name: Update Weekly Premier League Odds

on:
  schedule:
    # 09:00 Asia/Kolkata (IST is UTC+05:30 year-round).
    - cron: "30 3 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: avsm-data-pipeline
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install openpyxl

      - name: Recalculate next gameweek odds
        run: python scripts/build_data.py

      - name: Commit weekly odds
        id: commit
        run: |
          if [[ -n "$(git status --porcelain -- generated-data.js)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add generated-data.js
            git commit -m "Update weekly Premier League odds"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No weekly odds changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - name: Upload static site
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
