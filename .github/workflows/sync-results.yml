name: Sync Premier League Results

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install openpyxl

      - name: Sync final scores
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: python scripts/sync_results.py

      - name: Commit generated data
        id: commit
        run: |
          if [[ -n "$(git status --porcelain -- data generated-data.js)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data generated-data.js
            git commit -m "Sync Premier League results"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No result changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4

      - name: Upload result cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-results-cache
          path: |
            data/api-results.json
            data/score-observations.json
          if-no-files-found: ignore
