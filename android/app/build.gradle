plugins {
    id "com.android.application"
}

android {
    namespace "com.amalpanwar.avsm"
    compileSdk 35

    signingConfigs {
        release {
            def uploadKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            def uploadKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def uploadKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
            def uploadKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

            if (uploadKeystorePath && uploadKeystorePassword && uploadKeyAlias && uploadKeyPassword) {
                storeFile = file(uploadKeystorePath)
                storePassword = uploadKeystorePassword
                keyAlias = uploadKeyAlias
                keyPassword = uploadKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.amalpanwar.avsm"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
